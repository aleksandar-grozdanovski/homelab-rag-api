services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: homelab-rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homelab_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: homelab_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homelab_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  api:
    build:
      context: ./HomelabRAG.API
      dockerfile: Dockerfile
    container_name: homelab-rag-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=homelab_rag;Username=${POSTGRES_USER:-homelab_rag};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - ApiSecurity__ApiKey=${API_KEY:?Set API_KEY (at least 32 random characters) in .env}
      - DocumentIngestion__AllowedBaseDirectory=/documents
      - Ollama__BaseUrl=http://host.docker.internal:11434
      - Ollama__Model=llama3.2
      - LLMProvider=${LLM_PROVIDER:-ollama}
      - GroqSettings__ApiKey=${GROQ_API_KEY:-}
      - GroqSettings__ApiUrl=https://api.groq.com/openai/v1
      - GroqSettings__Model=llama-3.3-70b-versatile
      - GroqSettings__Enabled=${GROQ_ENABLED:-false}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DOCUMENTS_PATH:-./documents}:/documents:ro
    networks:
      - rag-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: homelab-rag-frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
